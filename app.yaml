command:
  - streamlit
  - run
  - app.py
  - --server.port=8080

env:
  - name: LAKEBASE_HOST
    value: ep-muddy-shape-d8ufskmd.database.us-east-2.cloud.databricks.com
  - name: LAKEBASE_DATABASE
    value: databricks_postgres
  - name: LAKEBASE_ENDPOINT
    value: projects/my-lakebase/branches/production/endpoints/primary
  - name: DATABRICKS_HOST
    valueFrom:
      env: DATABRICKS_HOST
  - name: DATABRICKS_TOKEN
    valueFrom:
      env: DATABRICKS_TOKEN
